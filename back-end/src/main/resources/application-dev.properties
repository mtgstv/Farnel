# Perfil "dev": valores para rodar no seu computador, com o banco do docker-compose.yml (porta 5433).
# Nada aqui é secreto de verdade: esse banco só existe no seu computador. Em produção, os valores vêm
# de variáveis de ambiente (ver application.properties).

# Opcional: um arquivo back-end/.env (modelo no .env.example) troca o banco do Docker pelo PostgreSQL
# instalado no computador. Os dois caminhos permitem rodar tanto de dentro de back-end/ quanto da raiz.
spring.config.import=optional:file:.env[.properties],optional:file:back-end/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/farnel}
spring.datasource.username=${DB_USUARIO:farnel}
spring.datasource.password=${DB_SENHA:farnel123}

# Estrutura do banco + doações de exemplo (db/exemplo só entra no perfil dev)
spring.flyway.locations=classpath:db/migration,classpath:db/exemplo

app.cors.allowed-origins=http://localhost:5173

app.auth.segredo-jwt=segredo-de-desenvolvimento-do-farnel-so-vale-no-perfil-dev
# Sem HTTPS no localhost: com true o navegador não guardaria o cookie
app.auth.cookie-seguro=false
